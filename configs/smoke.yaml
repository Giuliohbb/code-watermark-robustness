# Offline end-to-end check with a tiny random model and a 3-task local dataset.
# Create the model first:  python scripts/make_tiny_model.py .cache/tiny-model
run_name: smoke
output_dir: runs
dataset: humaneval
dataset_path: tests/fixtures/mini_problems.jsonl
task_limit: null

model:
  name: .cache/tiny-model
  dtype: float32
  device: cpu

generation:
  n_samples: 2
  max_new_tokens: 48
  temperature: 1.0
  top_k: 50
  top_p: 1.0
  seed: 1234

watermark:
  gamma: 0.5
  delta: 2.0
  hash_key: 15485863
  sweet_entropy_threshold: 0.9

conditions: [unwatermarked, kgw, sweet, stone]
detectors: [kgw, ewd, sweet, stone]

transforms:
  - name: black
  - name: strip_comments
  - name: rename
    fraction: 1.0
  - name: dead_code
    n_insertions: 3
  - name: minify

detection:
  device: cpu

evaluation:
  fpr_targets: [0.01, 0.05]
  negatives: [human, unwatermarked]
  functional_workers: 2
