[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "code-watermark-robustness"
version = "0.1.0"
description = "Benchmark of how LLM code watermarks (KGW, SWEET, STONE, EWD) survive semantics-preserving code edits."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "code-watermark-robustness authors" }]
keywords = ["llm", "watermarking", "code-generation", "robustness", "nlp"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.2",
    "transformers>=4.46,<5",
    "accelerate>=0.30",
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "pyyaml>=6.0",
    "typer>=0.12",
    "tqdm>=4.66",
    "libcst>=1.1",
    "black>=24.0",
    "python-minifier>=2.9",
    "evalplus>=0.3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6", "pre-commit>=3.7", "tokenizers>=0.19"]
plots = ["matplotlib>=3.8"]

[project.scripts]
cwm = "cwm.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/cwm"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["slow: tests that build and run a tiny language model"]
